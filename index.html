<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Маеток 4.1</title>
    <!-- Манифест для Android (полноэкранный режим и иконка) -->
<link rel="manifest" href="manifest.json">

<!-- Цвет верхней системной полоски (статус-бара) на Android -->
<meta name="theme-color" content="#09232f">

<!-- Иконка SVG для вкладок браузера (Chrome, Firefox и др.) -->
<link rel="icon" type="image/png" href="img/favicon.png">

<!-- Иконка для рабочего стола iPhone (180x180) -->
<link rel="apple-touch-icon" sizes="180x180" href="img/apple-touch-icon.png">

<!-- Короткое название под иконкой на экране iPhone (до 12 символов) -->
<meta name="apple-mobile-web-app-title" content="Маєток 4.1">

<!-- Включает полноэкранный режим без адресной строки Safari -->
<meta name="apple-mobile-web-app-capable" content="yes">

<!-- Цвет верхней системной полоски (время, батарея) под ваш тёмный фон -->
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <link rel="stylesheet" href="style.css?v=19">
</head>
<body class="dark">
    <header>
        <div class="container">
            <div class="logo">
                <a href="#" class="logo_image">
                    <img src="img/logo_dark.svg" alt="Energy-UA" onerror="this.style.display='none'">
                    <span class="logo_text">
                        <span class="logo_big_text">ЖК Київський маєток</span>
                        <span class="logo_small_text">Черга 4.1</span>
                    </span>
                </a>
                <!-- Плашка справа полностью удалена -->
            </div>
            <h1 class="main_header">График отключения <span>електроенергии</span></h1>
        </div>
    </header>
    <main>
        <div class="container">
            <!-- ТАЙМЕР -->
            <div class="ch_timer_wrap">
                <div class="ch_timer" id="timerBox">
                    <div class="ch_timer_text">
                        <b id="timerNextText">--:--</b>
                        <span id="timerStatusText">Загрузка данных...</span>
                    </div>
                    <div class="ch_timer_time">
                        <div class="timer_hour">
                            <span class="timer_num" id="timerHours">00</span>
                            <span class="timer_num_info">часов</span>
                        </div>
                        <div class="timer_min">
                            <span class="timer_num" id="timerMinutes">00</span>
                            <span class="timer_num_info">минут</span>
                        </div>
                        <div class="timer_sec">
                            <span class="timer_num" id="timerSeconds">00</span>
                            <span class="timer_num_info">секунд</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- ГРАФІК -->
            <h2 class="ch_day_title">График на сегодня</h2>
            <div class="scale_hours" id="scheduleGrid"></div>
            <!-- ГРАФИК НА ЗАВТРА -->
            <h2 class="ch_day_title">График на завтра</h2>
            <div class="scale_hours" id="scheduleGridTomorrow"></div>
                <!-- Сюди JS згенерує 24 колонки -->

            <div class="scale_info" style="justify-content: center; gap: 20px; margin-top: 20px;">
                <div class="periods_items">
                    <span><i class="legend-on" style="background:#ffd52d;"></i> Есть свет :)</span>
                </div>
                <div class="periods_items">
                    <span><i class="legend-off" style="background:#66738b;"></i> Нет света :(</span>
                </div>
            </div>
        </div>
    </main>

    <script src="script.js?v=6"></script>
</body>
</html>
